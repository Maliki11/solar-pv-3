<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكي زوايا السقوط الشمسي</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Tajawal,sans-serif;overflow:hidden}
.layout{display:grid;grid-template-columns:340px 1fr;height:100vh}
.panel{background:#fff;border-left:1px solid #eee;padding:20px;overflow-y:auto}
.back-link{color:#0e7490;text-decoration:none;margin-bottom:15px;display:inline-block}
h1{font-size:18px;margin-bottom:5px}
.sub{color:#666;font-size:13px;margin-bottom:20px}
.sec{margin-bottom:20px}
.sec-title{font-weight:bold;margin-bottom:10px;color:#ea580c}
.slider-row{margin-bottom:12px}
label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.val{color:#ea580c;font-weight:bold}
input[type=range]{width:100%}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ro{background:#f9f9f9;padding:10px;border-radius:8px;text-align:center}
.ro .lbl{font-size:11px;color:#666}
.ro .v{font-size:16px;font-weight:bold}
.good .v{color:#16a34a}
.warn .v{color:#d97706}
.bad .v{color:#dc2626}
.eff-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:8px 0}
.eff-fill{height:100%;transition:all .3s}
#canvasWrap{position:relative;background:linear-gradient(180deg,#87CEEB,#E0F0FF)}
#canvasWrap canvas{display:block;width:100%;height:100%}
#systemInfo{background:#e8f5e9;padding:12px;border-radius:8px;margin-bottom:15px;border-right:3px solid #4CAF50}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.8);padding:6px 12px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<div class="layout">
  <div class="panel">
    <a class="back-link" href="index.html">← العودة للحاسبة</a>
    
    <div id="systemInfo">
      <p><strong>عدد الألواح:</strong> <span id="panelCount">10</span></p>
      <p><strong>المساحة:</strong> <span id="totalArea">16.00</span> م²</p>
    </div>
    
    <h1>محاكي زوايا السقوط الشمسي</h1>
    <div class="sub">استكشف تأثير الميل والإتجاه على الكفاءة</div>
    
    <div class="sec">
      <div class="sec-title">الموقع والوقت</div>
      <select id="city">
        <option value="24.7">الرياض (24.7°)</option>
        <option value="24.5" selected>المدينة المنورة (24.5°)</option>
        <option value="21.5">مكة/جدة (21.5°)</option>
        <option value="26.4">بريدة (26.4°)</option>
      </select>
      <div class="slider-row">
        <label>الشهر <span class="val" id="monthVal">6 (يونيو)</span></label>
        <input type="range" id="month" min="1" max="12" value="6">
      </div>
      <div class="slider-row">
        <label>الوقت <span class="val" id="hourVal">12:00</span></label>
        <input type="range" id="hour" min="6" max="18" value="12" step="0.5">
      </div>
    </div>
    
    <div class="sec">
      <div class="sec-title">زوايا التركيب</div>
      <div class="slider-row">
        <label>زاوية الميل <span class="val" id="tiltVal">25°</span></label>
        <input type="range" id="tilt" min="0" max="60" value="25">
      </div>
      <div class="slider-row">
        <label>الإتجاه (الجنوب=180°) <span class="val" id="azVal">180°</span></label>
        <input type="range" id="az" min="0" max="360" value="180" step="5">
      </div>
    </div>
    
    <div class="sec">
      <div class="sec-title">النتائج</div>
      <div class="readout">
        <div class="ro"><div class="lbl">ارتفاع الشمس</div><div class="v" id="oElev">—</div></div>
        <div class="ro"><div class="lbl">إتجاه الشمس</div><div class="v" id="oAz">—</div></div>
        <div class="ro"><div class="lbl">زاوية السقوط</div><div class="v" id="oInc">—</div></div>
        <div class="ro good" id="effRo"><div class="lbl">الكفاءة</div><div class="v" id="oEff">—</div></div>
      </div>
      <div class="eff-bar"><div class="eff-fill" id="effFill" style="width:0%"></div></div>
    </div>
  </div>
  
  <div id="canvasWrap">
    <div class="hint">اسحب للدوران • مرّر للتكبير</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  
  // استقبال البيانات من الرابط
  const params = new URLSearchParams(window.location.search);
  const panelCount = parseInt(params.get('panels')) || 10;
  const totalArea = parseFloat(params.get('area')) || 16;
  
  document.getElementById('panelCount').textContent = panelCount;
  document.getElementById('totalArea').textContent = totalArea.toFixed(2);
  
  const DEG = Math.PI / 180;
  const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  
  // ✅ إنشاء مجموعة الألواح — صفوف من 4، ثابتة فوق الأرض
  function createPanelArray(count, areaTotal) {
    const mainGroup = new THREE.Group(); // مجموعة واحدة للتحكم الكلي
    
    const w = 1.6, h = 1.0; // أبعاد اللوح
    const gapX = 0.9, gapZ = 1.1; // مسافات بين الألواح
    const baseHeight = 0.7; // ارتفاع ثابت عن الأرض — لا يتغير ✅
    const scale = Math.sqrt((areaTotal/count)/(w*h));
    const pw = w * scale;
    const ph = h * scale;
    
    const perRow = 4; // كل صف 4 ألواح ✅
    const rows = Math.ceil(count / perRow);
    
    // توسيط المجموعة
    const totalW = (perRow - 1) * (pw + gapX);
    const totalD = (rows - 1) * (ph + gapZ);
    const startX = -totalW / 2;
    const startZ = -totalD / 2;
    
    let idx = 0;
    for(let r = 0; r < rows && idx < count; r++) {
      for(let c = 0; c < perRow && idx < count; c++) {
        
        // لوح واحد
        const panelGroup = new THREE.Group();
        
        // سطح اللوح
        const panelGeo = new THREE.BoxGeometry(pw, 0.04, ph);
        const panelMat = new THREE.MeshStandardMaterial({
          color: 0x1976D2, metalness: 0.2, roughness: 0.4
        });
        const panel = new THREE.Mesh(panelGeo, panelMat);
        panel.castShadow = true;
        panelGroup.add(panel);
        
        // عمود الدعم
        const poleGeo = new THREE.CylinderGeometry(0.05, 0.06, baseHeight, 8);
        const poleMat = new THREE.MeshStandardMaterial({
          color: 0x6B7280, metalness: 0.6, roughness: 0.3
        });
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.y = -baseHeight/2;
        panelGroup.add(pole);
        
        // موضع اللوح في الشبكة
        panelGroup.position.set(
          startX + c * (pw + gapX),
          baseHeight, // ✅ ثابت فوق الأرض — لا يغوص أبداً
          startZ + r * (ph + gapZ)
        );
        
        mainGroup.add(panelGroup);
        idx++;
      }
    }
    return mainGroup;
  }
  
  // إعداد المشهد
  const wrap = document.getElementById('canvasWrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  
  const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.1, 200);
  camera.position.set(8, 6, 10);
  
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.shadowMap.enabled = true;
  wrap.appendChild(renderer.domElement);
  
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  // إضاءة
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sunLight = new THREE.DirectionalLight(0xffffcc, 1.5);
  sunLight.castShadow = true;
  scene.add(sunLight);
  
  // شمس مرئية
  const sunSphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 32, 32),
    new THREE.MeshBasicMaterial({color: 0xFFD700})
  );
  scene.add(sunSphere);
  
  // أرض
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({color: 0xF5F5DC})
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  scene.add(new THREE.GridHelper(40, 40, 0xCCCCCC, 0xE5E5E5));
  
  // إضافة الألواح
  const solarArray = createPanelArray(panelCount, totalArea);
  scene.add(solarArray);
  
  // عناصر التحكم
  const citySel = document.getElementById('city');
  const monthIn = document.getElementById('month');
  const hourIn = document.getElementById('hour');
  const tiltIn = document.getElementById('tilt');
  const azIn = document.getElementById('az');
  
  function recalc() {
    const lat = parseFloat(citySel.value) * DEG;
    const month = parseInt(monthIn.value);
    const hour = parseFloat(hourIn.value);
    const tilt = parseFloat(tiltIn.value) * DEG;
    const az = parseFloat(azIn.value) * DEG;
    
    // تحديث العرض
    document.getElementById('monthVal').textContent = `${month} (${MONTHS[month-1]})`;
    document.getElementById('hourVal').textContent = `${hour.toFixed(1).replace('.', ':')}`;
    document.getElementById('tiltVal').textContent = `${tiltIn.value}°`;
    document.getElementById('azVal').textContent = `${azIn.value}°`;
    
    // حساب الشمس
    const day = (month - 1) * 30 + 15;
    const decl = 23.45 * Math.sin((360/365) * (284 + day) * DEG) * DEG;
    const hourAngle = (hour - 12) * 15 * DEG;
    
    const sinElev = Math.sin(decl)*Math.sin(lat) + Math.cos(decl)*Math.cos(lat)*Math.cos(hourAngle);
    const elev = Math.asin(Math.max(-1, Math.min(1, sinElev)));
    
    let sunAz;
    if (elev > 0) {
      const cosAz = (Math.sin(decl) - Math.sin(lat)*Math.sin(elev)) / (Math.cos(lat)*Math.cos(elev));
      sunAz = Math.acos(Math.max(-1, Math.min(1, cosAz)));
      if (hour > 12) sunAz = 2 * Math.PI - sunAz;
    } else {
      sunAz = Math.PI;
    }
    
    const cosInc = Math.sin(elev)*Math.cos(tilt) + Math.cos(elev)*Math.sin(tilt)*Math.cos(sunAz - az);
    const efficiency = Math.max(0, cosInc);
    
    // تحديث القراءات
    document.getElementById('oElev').textContent = (elev/DEG).toFixed(1) + '°';
    document.getElementById('oAz').textContent = (sunAz/DEG).toFixed(1) + '°';
    document.getElementById('oInc').textContent = (Math.acos(Math.max(0,cosInc))/DEG).toFixed(1) + '°';
    document.getElementById('oEff').textContent = (efficiency*100).toFixed(0) + '%';
    
    const fill = document.getElementById('effFill');
    fill.style.width = (efficiency*100) + '%';
    const ro = document.getElementById('effRo');
    if (efficiency >= 0.85) { fill.style.background='#22c55e'; ro.className='ro good'; }
    else if (efficiency >= 0.6) { fill.style.background='#f59e0b'; ro.className='ro warn'; }
    else { fill.style.background='#ef4444'; ro.className='ro bad'; }
    
    // ✅ التصليح النهائي للدوران — لا انقلاب ولا غوص
    solarArray.rotation.x = -tilt;   // ميل للأعلى ✅
    solarArray.rotation.y = Math.PI - az; // جنوب 180° يبقى جنوب ✅
    
    // تحديث موقع الشمس
    const sunDist = 20;
    sunSphere.position.set(
      sunDist * Math.cos(sunAz - Math.PI/2) * Math.cos(elev),
      sunDist * Math.sin(elev),
      sunDist * Math.sin(sunAz - Math.PI/2) * Math.cos(elev)
    );
    sunLight.position.copy(sunSphere.position);
  }
  
  citySel.addEventListener('change', recalc);
  monthIn.addEventListener('input', recalc);
  hourIn.addEventListener('input', recalc);
  tiltIn.addEventListener('input', recalc);
  azIn.addEventListener('input', recalc);
  
  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  recalc();
  animate();
  
  window.addEventListener('resize', () => {
    camera.aspect = wrap.clientWidth / wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });
})();
</script>
</body>
</html>
